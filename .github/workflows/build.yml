name: Modu Derle

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 25 kur
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Modu derle
        run: gradle build --stacktrace

      - name: JAR dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftAFK-26.2
          path: build/libs/*.jar
